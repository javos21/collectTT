# Render blueprint: two persistent processes + Postgres, all co-located.
#
# Applied at the END of Phase 0, once accounts, listings and images work locally.
# Deploying here proves the web + worker + managed-Postgres shape while the surface is
# still small enough to debug, rather than making the first deploy also carry auctions,
# transactions and the job scheduler.
#
# Serverless is ruled out deliberately: the worker loop needs second-level accuracy for
# auction soft-close (below cron's one-minute floor), SSE connections are held open, and
# both processes want stable pooled Postgres connections. All three want long-running
# servers.

databases:
  - name: collecttt-db
    plan: basic-256mb
    databaseName: collecttt
    user: collecttt

services:
  # ---------------------------------------------------------------- web process
  - type: web
    name: collecttt-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    # `prestart` in package.json applies committed migrations before Next handles
    # requests, including when Render uses a dashboard-level start command override.
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: collecttt-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false        # set to the deployed URL
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Cloudflare R2 — same S3 API as the local MinIO container, different credentials.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "false"
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: STORAGE_CORS_ORIGINS
        sync: false
      - key: EMAIL_ADAPTER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ---------------------------------------------------------------- worker process
  - type: worker
    name: collecttt-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: collecttt-db
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "4"
      # The worker sends notification email and writes image variants, so it needs the
      # same storage and email configuration as the web process.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "false"
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: STORAGE_CORS_ORIGINS
        sync: false
      - key: EMAIL_ADAPTER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
